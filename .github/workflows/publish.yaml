name: Publish

# Publishes to npm when a GitHub release is published. The release tag must
# match the version in package.json, e.g. v1.0.0-alpha.1.
#
# Uses npm trusted publishing (OIDC), no token needed. Set it up once on
# npmjs.com: package settings → Trusted Publisher → GitHub Actions,
# repository cyper85/osmAssist, workflow publish.yaml. The package settings
# only exist after the first version is on npm, so publish that one by hand
# (npm login, then npm publish).

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm
      # trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${version}"
            exit 1
          fi
          # while "latest" is only npm's placeholder (stub: true, 0.0.0-stage),
          # a pre-release becomes "latest" as well, so `npm install` gets it
          latest_is_stub=$(npm view osmassist@latest stub 2>/dev/null || true)
          case "$version" in
            *-*)
              if [ "$latest_is_stub" = "true" ]; then
                echo "NPM_TAG=latest" >> "$GITHUB_ENV"
              else
                echo "NPM_TAG=next" >> "$GITHUB_ENV"
              fi
              ;;
            *) echo "NPM_TAG=latest" >> "$GITHUB_ENV" ;;
          esac
      # prepublishOnly runs build and tests
      - run: npm publish --tag "$NPM_TAG"
